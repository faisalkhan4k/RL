services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      SALES_DB_PATH: /app/data/sales.sqlite3
      SALES_DATABASE_URL: postgresql://sales:local-demo-only@postgres:5432/sales
    volumes: ["sales-data:/app/data"]
    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: sales
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales"]
      interval: 5s
      retries: 10
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [jaeger]
  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/sales.yaml:ro
      - ./deploy/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/sales.yaml:ro
      - ./deploy/sales-dashboard.json:/var/lib/grafana/dashboards/sales.json:ro
    ports: ["127.0.0.1:3000:3000"]
volumes:
  postgres-data:
  sales-data:
  prometheus-data:
