name: SalesRLAgent checks
on: [push, pull_request]
jobs:
  sales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: apps/salesrlagent
        run: python -m pip install -e '.[training,test,research]'
      - working-directory: apps/salesrlagent
        run: python -m unittest discover -s tests -v
      - working-directory: apps/salesrlagent
        run: python -m sales_agent.hrl.train --steps 512 --episodes 2
      - working-directory: apps/salesrlagent
        run: node --test tests/voice-controller.test.cjs tests/cascade-controller.test.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: apps/salesrlagent/frontend
        run: npm ci && npm run build
      - working-directory: apps/salesrlagent
        run: docker compose config --quiet
      - working-directory: apps/salesrlagent
        run: docker build -t salesrlagent:ci .
